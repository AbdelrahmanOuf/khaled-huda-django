{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5efe9">
    <meta name="description" content="Celebrate {{ event.couple_names }} and their beautiful beginning.">
    <meta property="og:title" content="{{ event.couple_names }} — Our Forever Begins Here">
    <meta property="og:description" content="{{ event.hero_subtitle }}">
    <meta property="og:type" content="website">
    <title>{{ event.couple_names }} | Celebration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'site/css/site.css' %}">
    <script src="{% static 'site/js/site.js' %}" defer></script>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
